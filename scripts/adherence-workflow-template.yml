# CGSI 2027 brand adherence · consuming app workflow.
#
# Canonical copy lives in lib-app-shell at scripts/adherence-workflow-template.yml
# and is deployed byte-identical to all 17 app repos as
# .github/workflows/adherence.yml. Nothing in it is per-app: the baseline counts
# live in ADHERENCE.md, so there is no number here to go stale.
#
# ── WHY IT DOES NOT RUN `npm ci` ────────────────────────────────────────────
# The checker has zero dependencies, so it is fetched and run directly rather
# than installed. That is deliberate, not a shortcut:
#
# 🔴 Most app repos route the private @cg-spectrum scope to GitHub Packages via
# .npmrc, and the per-repository read grant is UI-only and incomplete across
# the estate (app-finance run 33428554537 returned 401). An adherence check
# that installs first would fail in those repos for a reason that has nothing
# to do with the brand, and a step that fails for the wrong reason gets
# ignored, then switched off.
#
# ⚖️ It also means every app checks against ONE ruleset at a known tag, instead
# of whichever rules happen to ship with that app's pinned app-shell. The
# estate currently spans four releases (v1.28.0 to v1.31.0), so installing
# would mean four different versions of the rules grading the same freeze.
#
# lib-app-shell is public and its tag archive resolves unauthenticated, so no
# token is needed. No secrets are used anywhere in this workflow.
#
# ── WHAT IT GATES ───────────────────────────────────────────────────────────
# ⚖️ On arrival it gated nothing. `continue-on-error: true` was set because
# every app started non-zero — 787 findings across the estate at the phase 1
# baseline — and a step that fails on day one gets switched off in a week. It
# reported the count on every push so the direction of travel was visible.
#
# 🟢 That line was REMOVED on 21 Oct 2026. All 17 apps reached 0 at the close
# of phase 4 (2,172 findings cleared in phase 3 alone), which is the condition
# this file set for itself. The check now FAILS on a single finding, in every
# repo, and the achievement is a guarantee instead of a snapshot.
#
# ⛔ Do not put it back to get a red run green. A finding means an app has
# drifted off the standard; fix the finding, or amend the skill first and then
# the rule, per app-shell `src/styles/ADHERENCE.md`.
#
# 🔴 This is still a DETECTOR, NOT A DEPLOY GATE. A push to main deploys
# production in these repos and Vercel does not wait for Actions, so a failing
# run tells you the drift shipped — it does not stop it shipping. Closing that
# needs branch protection, which is a change to how people work, not a
# workflow file. app-shell is the exception and genuinely gates, because
# nothing deploys from a library.
#
# ⛔ Do not add `npm ci` to "make it consistent" with the other workflows. The
# install is the thing this deliberately avoids; see above.

name: adherence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adherence-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ruleset version: a lib-app-shell commit SHA, not a tag.
  #
  # ⚖️ A SHA rather than a tag for two reasons. It is immutable, where a tag can
  # be force-moved, and the thing being pinned is what every app in the estate
  # is graded against. And it decouples the brand rules from the package
  # release cycle: changing a rule should not require cutting a package
  # version, and a CI check should not be blocked on a release decision.
  #
  # Bump deliberately, and expect every app's count to move when you do.
  # 97edff8 = 2027 phase 1 (new tokens, frozen retirements, adherence check).
  # 90e8fe0 = 2027 phase 3 close. Four rules the phase 1 set could not see:
  #   8- and 4-digit hex (#rrggbbaa slipped the word boundary on both arms),
  #   hex alpha welded to a var() by a codemod, font-family set from a React
  #   style object, and a mask-image gradient wrongly read as a gradient fill.
  #   Findings in a generated file now report under UPSTREAM instead of being
  #   counted, because the fix belongs in the generator's input.
  # 2b82a44 = phase 4. GEOMETRY IS ENFORCED: a rounded corner, outer shadow or
  #   gradient fill now FAILS instead of being reported. Every repo was taken to
  #   zero geometry first, so this bump should change no count — if it changes
  #   yours, something landed between the sweep and the merge. Also exempts the
  #   three things the geometry rules were wrong about: a mask-image gradient
  #   (edge fade), a repeating gradient (hatch), and a zero-offset zero-blur
  #   box-shadow (focus ring, required by WCAG 2.4.7).
  # dfb1100 = raw-palette, and it is a FREEZE rule. A stock Tailwind palette
  #   class (bg-green-100, dark:text-amber-400, bg-red-900/40) is the same
  #   offence as a raw hex and raw-hex never saw one, so every colour count
  #   this estate recorded before 23 Oct 2026 was a count of SPELLINGS. 123
  #   findings across 8 repos, all of them an error line, a callout or a
  #   filled pill; all cleared before this bump. If yours is not zero,
  #   something landed between the sweep and the merge.
  # 8a11185 = 23 Oct 2026. Two rule changes. THE EMAIL EXEMPTION IS NARROWED to
  #   a directory named `emails/` or `email-templates/`, or a `*.email.*`
  #   suffix, and never under a segment named `app`. It had matched any path
  #   segment, excusing 62 source files across 6 repos from EVERY rule since
  #   the checker was written, so every count taken before this ref was taken
  #   with those files excused. One genuine template (marketing) moved inside
  #   the convention; the rest were already clean. And `raw-rgb` — the third
  #   spelling of a raw colour, `rgba(251,191,36,.4)` beside `#dc2626` and
  #   `bg-red-600` — IS A FREEZE RULE, not advisory: 33 lines across 11 repos,
  #   all cleared the same afternoon before this bump. Every repo was verified
  #   at 0 against this exact SHA before the wave, so this bump should change
  #   no count — if yours is not zero, something landed between the sweep and
  #   the merge.
  # 0cf340f = 25 Oct 2026, the fourth colour pass. Three FREEZE rules and two
  #   advisories, every one a line that sat at "0 errors" in a live repo.
  #   `deprecated-soft` now reads the Tailwind spelling: `bg-accent-soft`
  #   resolves to NOTHING (the token left brand.css at the flip), so the chip
  #   wearing it has had no fill since. `token-alpha`: `bg-accent/10` and its
  #   arbitrary twin `bg-[var(--color-accent)]/20` are the fourth spelling of
  #   a hand-mixed tint, and on light they mix from Ink Green; the bracket
  #   form outnumbers the short one ten to one and the first survey missed
  #   it. `concatenated-token`: `var(--color-${x})` is a token no rule can
  #   read — scheduling built three frozen discipline tokens that way and the
  #   dots inverted at the flip with no finding. ADVISORY, not gating:
  #   `accent-as-paint-class` (`border-[var(--color-accent)]`, the Tailwind
  #   spelling of accent-as-paint; 155 lines across 14 repos — decoration →
  #   -mark, boundary or labelled fill → pragma) and `label-on-accent`
  #   (`text-white` on the accent fill, 1.9:1 on dark; the label is text-bg).
  #   And `rounded-corners` now reads `rounded-[6px]`, the arbitrary spelling
  #   a freeze rule at 0 estate-wide had never seen (20 lines, 3 repos).
  #   Every freeze finding (7 repos) was cleared before this bump, so it
  #   should change no error count — if yours is not zero, something landed
  #   between the sweep and the merge. The two advisory counts WILL appear in
  #   the run summary for the first time.
  # 98ebddb = 25 Oct 2026, the button is a part. Three rules move from
  #   advisory to FREEZE the same day they arrived, once `Button` shipped in
  #   @cgsi/app-shell v3.5.0 and eleven apps adopted it: `accent-as-paint-class`
  #   (border-[var(--color-accent)] as decoration wants -mark; a boundary or a
  #   labelled fill the part cannot serve takes the pragma by name),
  #   `label-on-accent` (text-white on the accent fill, 1.9:1 on dark) and
  #   `rebuilt-button` (the Header's secondary register copied by hand; now
  #   also reads the hover label's arbitrary spelling, which hid one copy).
  #   Counted against this exact sha before the bump: 25 lines in the estate
  #   (marketing 22, auth 2, referrals 1), every one cleared in the same PR
  #   as this pin, so the bump should change no count — if yours is not
  #   zero, something landed between the sweep and the merge. The three
  #   advisory counts leave the run summary; they are errors now.
  ADHERENCE_REF: 98ebddb4c5c9c4ebb3540175b984bb056fee73ee

jobs:
  adherence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch the checker
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/CG-Spectrum/lib-app-shell/${ADHERENCE_REF}/scripts/adherence.mjs" \
            -o /tmp/adherence.mjs
          test -s /tmp/adherence.mjs

      # ⛔ No continue-on-error. Every app is at 0; see WHAT IT GATES above.
      - name: Brand adherence (2027 app layer)
        id: check
        run: node /tmp/adherence.mjs src

      # ⚖️ ADVISORY IS REPORTED, NEVER GATED. continue-on-error is deliberate:
      # rebuilt-table and rebuilt-part together are ~178 findings estate-wide
      # and would take 14 repos red in one commit for debt they did not create
      # this week, which is how a checker gets switched off. Reporting makes
      # the number move in daylight; the tier changes when it is near zero.
      - name: Advisory (spacing scale, rebuilt parts)
        if: always()
        continue-on-error: true
        run: node /tmp/adherence.mjs src --advisory || true

      - name: Record the count
        if: always()
        run: |
          COUNT=$(node /tmp/adherence.mjs src 2>/dev/null \
            | grep -oE '^[0-9]+ error' | grep -oE '^[0-9]+' || echo 0)
          {
            echo "### 2027 brand adherence"
            echo ""
            echo "**$COUNT findings** in \`src\`, graded against \`$ADHERENCE_REF\`."
            echo ""
            if [ "$COUNT" -eq 0 ]; then
              echo "Clean."
            else
              echo "Phase 1 baselines per app are in app-shell \`src/styles/ADHERENCE.md\`."
              echo "A finding is a raw hex value, a non-brand font, or a token frozen by the rebrand."
            fi
            echo ""
            echo "_Ruleset \`${ADHERENCE_REF:0:7}\` · enforced; this app is at zero and cannot regress._"
          } >> "$GITHUB_STEP_SUMMARY"
